set default=0
set timeout=2

set menu_color_normal=light-cyan/dark-gray
set menu_color_highlight=white/black

menuentry "FeatherOS (Linux Kernel 6.x Base Layer - Production)" {
    insmod gzio
    insmod part_gpt
    insmod ext2
    set root='hd0,gpt2'
    echo "Loading FeatherOS Linux Base Kernel..."
    linux /boot/vmlinuz-feather root=/dev/vda2 ro console=tty0 console=ttyS0,115200 quiet loglevel=3 init=/init
    echo "Loading FeatherOS Initramfs..."
    initrd /boot/initramfs-feather.img
}

menuentry "FeatherOS (Recovery / Direct Cognitive Shell)" {
    insmod gzio
    insmod part_gpt
    insmod ext2
    set root='hd0,gpt2'
    echo "Loading FeatherOS Base Kernel in Recovery Mode..."
    linux /boot/vmlinuz-feather root=/dev/vda2 rw single init=/bin/feather
    initrd /boot/initramfs-feather.img
}
