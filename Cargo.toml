[workspace]
resolver = "2"
members = [
    # OS Layer (Platform-Independent Substrate) — C++ via CMake
    "os/core/feather-hal",
    "os/services/featherd",
    "os/services/feather-watch",
    "os/services/feather-ipc",
    "os/safety/aegis-exec",
    "os/safety/aegis-snapshot",

    # Application Layer (User Space)
    "apps/shell/aish",
    "apps/tui/feather-tui",
]

[workspace.dependencies]
# OS Layer Internal Dependencies (C++ via CMake — not Rust crates)
# feather-hal, feather-ipc, featherd, feather-watch, aegis-exec,
# aegis-snapshot, synapsed are built with CMake, not Cargo.

# Application Layer Internal Dependencies
aish = { path = "apps/shell/aish" }
feather-tui = { path = "apps/tui/feather-tui" }

# External Shared Dependencies
async-trait = "0.1"
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
colored = "2.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
regex = "1.10"
rustyline = "14.0"
tempfile = "3.13"
fs2 = "0.4"
