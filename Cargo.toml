[workspace]
resolver = "2"
members = [
    "crates/aegis-exec",
    "crates/cortex-core",
    "crates/agent-bus",
    "crates/synapsed",
    "crates/aish",
    "crates/feather-ipc",
    "crates/featherd",
    "crates/feather-watch",
    "crates/aegis-snapshot",
    "crates/feather-embed",
    "crates/feather-tui",
]

[workspace.dependencies]
async-trait = "0.1"
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
colored = "2.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
regex = "1.10"
rustyline = "14.0"
tempfile = "3.13"
fs2 = "0.4"
