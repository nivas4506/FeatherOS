[workspace]
resolver = "2"
members = [
    # OS Layer (Platform-Independent Substrate)
    "os/core/feather-hal",
    "os/services/featherd",
    "os/services/synapsed",
    "os/services/feather-watch",
    "os/services/feather-ipc",
    "os/safety/aegis-exec",
    "os/safety/aegis-snapshot",
    "os/intelligence/cortex-core",
    "os/intelligence/agent-bus",
    "os/intelligence/feather-embed",

    # Application Layer (User Space)
    "apps/shell/aish",
    "apps/tui/feather-tui",
]

[workspace.dependencies]
# OS Layer Internal Dependencies
feather-hal = { path = "os/core/feather-hal" }
feather-ipc = { path = "os/services/feather-ipc" }
featherd = { path = "os/services/featherd" }
synapsed = { path = "os/services/synapsed" }
feather-watch = { path = "os/services/feather-watch" }
aegis-exec = { path = "os/safety/aegis-exec" }
aegis-snapshot = { path = "os/safety/aegis-snapshot" }
cortex-core = { path = "os/intelligence/cortex-core" }
agent-bus = { path = "os/intelligence/agent-bus" }
feather-embed = { path = "os/intelligence/feather-embed" }

# Application Layer Internal Dependencies
aish = { path = "apps/shell/aish" }
feather-tui = { path = "apps/tui/feather-tui" }

# External Shared Dependencies
async-trait = "0.1"
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
colored = "2.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
regex = "1.10"
rustyline = "14.0"
tempfile = "3.13"
fs2 = "0.4"
